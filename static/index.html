<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英语听说自适应训练</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --accent:#38bdf8; --ok:#34d399; --bad:#f87171; --muted:#94a3b8; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
         background:var(--bg); color:#e2e8f0; padding:24px; }
  .wrap { max-width:760px; margin:0 auto; }
  h1 { font-size:22px; margin:0 0 16px; }
  .bar { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:20px;
         background:var(--card); padding:14px 16px; border-radius:12px; font-size:14px; }
  .bar b { color:var(--accent); }
  .card { background:var(--card); border-radius:14px; padding:22px; margin-bottom:16px; }
  .task-label { font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; }
  .sentence { font-size:22px; margin:14px 0; line-height:1.5; }
  input[type=text] { width:100%; padding:12px; font-size:16px; border-radius:8px;
                     border:1px solid #334155; background:#0b1220; color:#e2e8f0; }
  button { background:var(--accent); color:#0b1220; border:0; padding:11px 18px;
           font-size:15px; border-radius:8px; cursor:pointer; font-weight:600; }
  button.secondary { background:#334155; color:#e2e8f0; }
  .row { display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; }
  .feedback { margin-top:16px; padding:14px; border-radius:10px; background:#0b1220; font-size:14px; }
  .ok { color:var(--ok); } .bad { color:var(--bad); }
  .muted { color:var(--muted); }
  .hidden { display:none; }

  /* board selection */
  .boards { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:10px; }
  @media (max-width:560px){ .boards { grid-template-columns:1fr; } }
  .board { background:#0b1220; border:1px solid #334155; border-radius:14px;
           padding:26px 22px; text-align:center; cursor:pointer; transition:border-color .15s, transform .15s; }
  .board:hover { border-color:var(--accent); transform:translateY(-2px); }
  .board .icon { font-size:34px; }
  .board .title { font-size:18px; font-weight:700; margin:10px 0 6px; }
  .board .desc { font-size:13px; color:var(--muted); line-height:1.6; }
  .crumb { display:inline-flex; align-items:center; gap:8px; font-size:14px; margin-bottom:14px; cursor:pointer; color:var(--muted); }
  .crumb:hover { color:var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <h1>英语听说自适应训练闭环</h1>
  <div class="bar" id="bar">加载中…</div>

  <!-- board selection screen -->
  <div class="card" id="boardCard">
    <div class="task-label">选择训练板块</div>
    <div class="boards">
      <div class="board" data-board="listening">
        <div class="icon">🎧</div>
        <div class="title">听力听写</div>
        <div class="desc">播放英文句子，听音后写下听到的单词，系统逐词核对准确率。</div>
      </div>
      <div class="board" data-board="speaking">
        <div class="icon">🗣️</div>
        <div class="title">口语跟读</div>
        <div class="desc">看着句子跟读，把所说内容填入文本框，系统对照原文纠正读音与漏词。</div>
      </div>
    </div>
    <div class="row">
      <button class="secondary" id="resetBtn2">重置进度</button>
    </div>
  </div>

  <!-- practice screen -->
  <div class="card hidden" id="quizCard">
    <div class="crumb" id="backBtn">‹ 返回选择板块</div>
    <div class="task-label" id="taskLabel">任务</div>
    <div class="sentence" id="sentence"></div>

    <div id="listenPanel">
      <button id="playBtn">▶ 播放句子（听力）</button>
      <div class="muted" style="margin-top:8px">听完后写下你听到的句子：</div>
      <input type="text" id="listenInput" placeholder="type what you hear...">
    </div>

    <div id="speakPanel" class="hidden">
      <div class="muted">跟读下面这句：点「开始录音」说完后停止，系统用 Whisper 转写并评分；也可以直接在框里手打你说的内容。</div>
      <div class="row">
        <button id="recBtn" class="secondary">● 开始录音</button>
        <span class="muted" id="recStatus"></span>
      </div>
      <input type="text" id="speakInput" placeholder="what you said...（录音后自动填入转写结果）" style="margin-top:12px">
    </div>

    <div class="row">
      <button id="submitBtn">提交</button>
      <button class="secondary" id="resetBtn">重置进度</button>
    </div>
    <div class="feedback hidden" id="feedback"></div>
  </div>
</div>

<script>
let currentItem = null;
let activeBoard = null;   // "listening" | "speaking"
let mediaRecorder = null;
let recordedBlob = null;

async function getJSON(url, opts={}) {
  const r = await fetch(url, opts); return r.json();
}

function speak(text) {
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US"; u.rate = 0.95;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}

function refreshBar() {
  return getJSON("/api/state").then(st => {
    document.getElementById("bar").innerHTML =
      `当前等级 <b>${st.level}</b> · 阶段 <b>${st.phase}</b> · 弱项 <b>${st.weakness}</b> · 本阶段已练 <b>${st.practice_count}</b> 单元`;
    return st;
  });
}

// ---- board selection ----
function showBoards() {
  activeBoard = null;
  document.getElementById("boardCard").classList.remove("hidden");
  document.getElementById("quizCard").classList.add("hidden");
  refreshBar();
}

function enterBoard(board) {
  activeBoard = board;
  document.getElementById("boardCard").classList.add("hidden");
  document.getElementById("quizCard").classList.remove("hidden");
  loadNext();
}

document.querySelectorAll(".board").forEach(el => {
  el.onclick = () => enterBoard(el.dataset.board);
});
document.getElementById("backBtn").onclick = showBoards;

// ---- practice loop ----
async function loadNext() {
  const data = await getJSON("/api/next");
  if (data.batch_done) { handleBatchDone(data); return; }
  currentItem = data.item;
  const fb = document.getElementById("feedback");
  fb.classList.add("hidden");
  if (!currentItem) { document.getElementById("sentence").textContent = "完成"; return; }

  // keep the session consistent with the chosen board; if the next item belongs to
  // the other side, swap it to the active board from the same level bank.
  if (currentItem.task !== activeBoard) {
    const alt = await findAlternate(activeBoard);
    if (alt) currentItem = alt;
  }

  const isListen = currentItem.task === "listening";
  document.getElementById("taskLabel").textContent =
    (isListen ? "听力听写 " : "口语跟读 ") + "· " + currentItem.level;
  document.getElementById("listenPanel").classList.toggle("hidden", !isListen);
  document.getElementById("speakPanel").classList.toggle("hidden", isListen);
  document.getElementById("sentence").textContent = isListen ? "（听句子，然后听写）" : currentItem.text;
  document.getElementById("listenInput").value = "";
  document.getElementById("speakInput").value = "";
  recordedBlob = null;
  resetRecUI();
  document.getElementById("playBtn").onclick = () => speak(currentItem.text);
}

// ---- microphone recording ----
const recBtn = document.getElementById("recBtn");
const recStatus = document.getElementById("recStatus");

function resetRecUI() {
  recBtn.textContent = "● 开始录音";
  recBtn.classList.remove("recording");
  recStatus.textContent = "";
}

async function toggleRecording() {
  if (mediaRecorder && mediaRecorder.state === "recording") {
    mediaRecorder.stop();
    return;
  }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    recStatus.textContent = "当前浏览器不支持录音（需 HTTPS 或 localhost），可手打转写。";
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(stream);
    const chunks = [];
    mediaRecorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
    mediaRecorder.onstop = () => {
      recordedBlob = new Blob(chunks, { type: mediaRecorder.mimeType });
      stream.getTracks().forEach(t => t.stop());
      recBtn.textContent = "● 开始录音";
      recStatus.textContent = "已录音 " + (recordedBlob.size / 1024).toFixed(1) + " KB，可提交或重录";
    };
    mediaRecorder.start();
    recBtn.textContent = "■ 停止录音";
    recStatus.textContent = "录音中…说完后点停止";
  } catch (err) {
    recStatus.textContent = "麦克风不可用：" + err.message + "（可手打转写）";
  }
}
recBtn.onclick = toggleRecording;

// Find an item of the active board for the current level from the bank.
async function findAlternate(board) {
  const bank = await getJSON("/api/bank");
  const st = await getJSON("/api/state");
  const rows = (bank[st.level] || []).filter(r => r.task === board);
  if (!rows.length) return null;
  const idx = Math.floor(Math.random() * rows.length);
  return { item_id: `${st.level}-${board}-${idx}`, level: st.level, task: board, text: rows[idx].text };
}

function handleBatchDone(data) {
  const fb = document.getElementById("feedback");
  fb.classList.remove("hidden");
  let html = "";
  if (data.diagnose) {
    html = `摸底完成：定级 <b>${data.diagnose.placed_level}</b>，弱项 <b>${data.diagnose.weakness}</b>
            （听力 ${data.diagnose.listening} / 口语 ${data.diagnose.speaking}）`;
  } else if (data.evaluate) {
    const e = data.evaluate;
    const cls = e.action === "UP" ? "ok" : (e.action === "DOWN" ? "bad" : "");
    html = `评估完成：听力 ${e.listening} / 口语 ${e.speaking} →
            <span class="${cls}"><b>${e.action}</b></span>。${e.reason}`;
  }
  fb.innerHTML = html + "<br><span class='muted'>即将进入下一阶段…</span>";
  setTimeout(showBoards, 1800);
}

async function submit() {
  if (!currentItem) return;
  const fd = new FormData();
  fd.append("item_id", currentItem.item_id);
  fd.append("task", currentItem.task);
  if (currentItem.task === "listening") {
    fd.append("listening_text", document.getElementById("listenInput").value);
  } else {
    // If a recording exists, let the backend transcribe it with Whisper;
    // otherwise fall back to the typed transcript.
    if (recordedBlob) {
      fd.append("audio", recordedBlob, "speaking.webm");
    } else {
      fd.append("speaking_transcript", document.getElementById("speakInput").value);
    }
  }
  const fb = document.getElementById("feedback");
  fb.classList.remove("hidden");
  fb.innerHTML = currentItem.task === "speaking" && recordedBlob
    ? "正在识别语音并评分…" : "提交中…";
  const res = await getJSON("/api/answer", { method:"POST", body: fd });
  const sc = res.score;
  let html = `准确率 <b class="${sc.accuracy>=0.75?'ok':'bad'}">${(sc.accuracy*100).toFixed(0)}%</b>
    · WER ${sc.wer}
    ${sc.wrong_words.length ? '<br>需注意的词：<span class="bad">'+sc.wrong_words.join(", ")+'</span>' : '<br><span class="ok">全对！</span>'}`;
  if (res.transcript) html += `<br><span class="muted">识别结果：${res.transcript}</span>`;
  if (res.phoneme && res.phoneme.available) {
    const p = res.phoneme;
    html += `<br><span class="muted">发音音素分 ${(p.overall_accuracy*100).toFixed(0)}%</span>`;
    if (p.words && p.words.length) {
      const tags = p.words.map(w => {
        const ph = w.expected_phonemes.join(" ");
        return w.weak
          ? `<span class="bad" title="音素 ${ph}">${w.word}▲</span>`
          : `<span title="音素 ${ph}">${w.word}</span>`;
      }).join(" ");
      html += `<br>词级发音：${tags}`;
      if (p.weak_words && p.weak_words.length) {
        html += `<br><span class="bad">需重点纠正：${p.weak_words.join(", ")}</span>`;
      }
    }
  }
  fb.innerHTML = html;
  setTimeout(loadNext, 900);
}

document.getElementById("submitBtn").onclick = submit;
async function doReset() { await getJSON("/api/reset", {method:"POST"}); showBoards(); }
document.getElementById("resetBtn").onclick = doReset;
document.getElementById("resetBtn2").onclick = doReset;

showBoards();
</script>
</body>
</html>
